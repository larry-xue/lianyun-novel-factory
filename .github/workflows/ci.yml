name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.6.5 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Postgres
        run: docker compose up -d postgres

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 60); do
            if docker compose exec -T postgres pg_isready -U lianyun -d lianyun; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs postgres
          exit 1

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Seed database
        run: pnpm db:seed

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Stop services
        if: always()
        run: docker compose down -v
